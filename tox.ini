[tox]
envlist = py{311,312}-qiskit{1.2,1.4,2.0,2.5}

[testenv]
deps =
    pytest
    pytest-cov
    pydantic
    qiskit-aer
    qiskit1.2: qiskit~=1.2.0
    qiskit1.4: qiskit~=1.4.0
    qiskit2.0: qiskit~=2.0.3
    qiskit2.5: qiskit~=2.5.0
    qiskit1.2,qiskit1.4,qiskit2.0: iqm-client[qiskit]==33.0.4 
commands =
    pytest tests/ -m "not slow" --cov=QCut --cov-report=term-missing

[testenv:type]
deps = ty
commands = uvx ty check QCut/

[testenv:ci]
description = What CI checks, except the tests
dependency_groups = docs
deps =
    ruff
    ty
commands =
    ruff check
    ty check QCut/
    sphinx-build -q -b html docs docs/build/sphinx/html -W